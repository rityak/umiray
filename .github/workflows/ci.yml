name: Checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run release:check
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri

  # Linux (D-173): код под `cfg(not(windows))` на Windows не компилируется вовсе —
  # без этого задания его ломали бы незаметно.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked
        working-directory: src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
