# Каталог rule sets (D-157): списки доменов и подсетей, которые клиент умеет скачать.
#
# Это ваш файл: правьте, удаляйте, добавляйте. Клиент его не перезаписывает.
#
# Поля списка:
#   id        — имя файла и имя в правиле: RULE-SET,<id>,umiray. Буквы, цифры, дефис.
#   title     — как список называется в окне; title_en — по-английски, если язык окна английский
#   group     — blocked, services, russia: как каталог разбит на части
#   note      — строка под именем: что внутри; note_en — по-английски
#   urls      — откуда. Несколько адресов складываются в один список
#
# Форматы клиент узнаёт сам: простой список (голый домен — с поддоменами), payload
# Clash/mihomo (голый домен — точный, +. — с поддоменами), domain:/full: v2ray,
# JSON sing-box. Сверено 30.09.2026 (S-028).

version: 1
lists:
  # Заблокированное в России
  - id: itdog-inside
    title: Russia inside — itdoginfo
    group: blocked
    note: заблокированное и закрытое для России — ~1,5 тыс. доменов, хватает большинству
    note_en: blocked in Russia and geo-blocked for it — ~1.5k domains, enough for most
    urls:
      - https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Russia/inside-raw.lst
  - id: antifilter-community
    title: antifilter community
    group: blocked
    note: что сообщество добавило к реестру — домены и адреса
    note_en: what the community added to the registry — domains and addresses
    urls:
      - https://community.antifilter.download/list/domains.lst
      - https://community.antifilter.download/list/community.lst
  - id: ru-blocked
    title: ru-blocked — runetfreedom
    group: blocked
    note: реестр без мусорных доменов и адреса antifilter
    note_en: the registry without junk domains, plus antifilter addresses
    urls:
      - https://github.com/runetfreedom/russia-blocked-geosite/releases/latest/download/ru-blocked.txt
      - https://raw.githubusercontent.com/runetfreedom/russia-blocked-geoip/release/clash/ipcidr/ru-blocked.txt
  - id: refilter
    title: Re:filter
    group: blocked
    note: реестр и популярное недоступное из России
    note_en: the registry and popular sites unavailable from Russia
    urls:
      - https://github.com/1andrevich/Re-filter-lists/releases/latest/download/domains_all.lst
      - https://github.com/1andrevich/Re-filter-lists/releases/latest/download/ipsum.lst
  - id: legiz-ru-bundle
    title: ru-bundle — legiz
    group: blocked
    note: подборка под mihomo — itdoginfo, antifilter community и свои
    note_en: a mihomo-oriented bundle — itdoginfo, antifilter community and extras
    urls:
      - https://raw.githubusercontent.com/legiz-ru/mihomo-rule-sets/main/ru-bundle/rule.yaml
  - id: antifilter
    title: antifilter — реестр целиком
    title_en: antifilter — full registry
    group: blocked
    note: весь реестр РКН — около миллиона доменов и свёрнутые подсети
    note_en: the whole RKN registry — about a million domains and summarized subnets
    urls:
      - https://antifilter.download/list/domains.lst
      - https://antifilter.download/list/allyouneed.lst
  - id: antizapret
    title: antizapret
    group: blocked
    note: реестр целиком из antizapret-sing-box — 1,8 млн записей; обновляется редко
    note_en: the whole registry from antizapret-sing-box — 1.8M entries; rarely updated
    urls:
      - https://github.com/savely-krasovsky/antizapret-sing-box/releases/latest/download/antizapret-ruleset.json

  # Сервисы: домены и подсети
  - id: youtube
