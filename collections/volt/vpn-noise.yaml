# Experimental endpoint noise; validate the selected VPN transport before use.
version: 1
default_action: pass

udp:
  enabled: true

profiles:
  - name: vpn-tls-noise
    match:
      network: tcp
      payloads: [tls]
    stages:
      - action: disorder
        positions: ['1', midsld]
        packet_limit: 2
        byte_limit: 16384
        fake:
          kind: tls-auto
          server_name_source: noise-extended
          repeats: 1

  - name: vpn-quic-noise
    match:
      network: udp
      payloads: [quic]
    stages:
      - action: fake
        packet_limit: 2
        byte_limit: 16384
        fake:
          kind: quic
          server_name_source: noise-extended
          repeats: 1

  - name: vpn-unknown-udp-pass
    match:
      network: udp
      payloads: [unknown]
    stages:
      - action: pass
        packet_limit: 1
        byte_limit: 65536
