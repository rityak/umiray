# Endpoint profile for volt.exe; provide actual remote IP:port through -endpoint.
version: 1
default_action: pass

udp:
  enabled: false

profiles:
  - name: vpn-tls-split
    match:
      network: tcp
      payloads: [tls]
    stages:
      - action: split
        positions: ['1', midsld]
        packet_limit: 2
        byte_limit: 16384
