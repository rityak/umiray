# Реклама и трекеры — в никуда. Список берётся из базы ядра
# (GeoSite, category-ads-all), поэтому здесь одна строка, а не десять тысяч.
#
# Базы нет на машине — ядро скачает её само при запуске (4 МБ, полторы секунды).
# Значит на машине без сети и без базы ядро с этим набором не поднимется вовсе.
title: Блокировка рекламы
title_en: Ad blocking
rules:
  - GEOSITE,category-ads-all,REJECT
