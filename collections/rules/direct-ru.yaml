# Прямой выход для российских адресов: мимо прокси, а не через него.
# Правится как обычный файл; `title` — наше поле, всё остальное ядро читает само.
#
# `no-resolve` — по умолчанию у всего прямого: адрес домена ради правила не узнаём. У regex
# ядро прочло бы его целью — сборка отдаёт такие строки без хвоста.
title: Россия — напрямую
title_en: Russia — direct
rules:
