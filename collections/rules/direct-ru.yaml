  - DOMAIN-SUFFIX,xn--p1ai,DIRECT,no-resolve
  - DOMAIN-SUFFIX,vk.com,DIRECT,no-resolve
  - DOMAIN-SUFFIX,userapi.com,DIRECT,no-resolve
  - DOMAIN-SUFFIX,vk-portal.net,DIRECT,no-resolve
