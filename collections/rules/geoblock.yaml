# Сервисы, которые сами закрылись для России: не блокировка РКН, а «недоступно в вашей
# стране». Здесь основные; полный список (~500 доменов) — rule set itdoginfo geoblock:
# https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Categories/geoblock.lst
# Нейросети — отдельным набором «Нейросети».
#
# Выход — AUTO, а не выбор в «Соединении»: там может стоять DIRECT, и тогда сервис
# снова увидел бы российский адрес. Сменить выход можно в «Маршрутизации».
# Сверено 02.10.2026 с itdoginfo/allow-domains (Categories/geoblock).
