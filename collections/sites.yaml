# Эталонные ресурсы: по ним видно, что именно недоступно — и нужен ли тут VPN вообще.
#
# Это ДАННЫЕ, как и коллекция резолверов: добавить адрес — правка файла, ни строки
# на Rust. Копия кладётся в `%LOCALAPPDATA%\umiray-client\collections\` при первом запуске,
# дальше читается она.
#
# Поля:
#   id     — короткое имя, по нему на ресурс ссылаются отчёты. Менять нельзя.
#   name   — как показать человеку.
#   url    — что запрашиваем. Лёгкая страница или служебная точка: качать мегабайты
#            ради «открывается ли» незачем.
#   group  — зачем он в списке: base (должен работать всегда) | blocked (в России
#            закрыт) | cdn (большие сети, по ним видно шейпинг).
#   note   — одна строка: что значит, если он не ответил.
#
# Ответ 403 или 404 — это тоже ответ: сервер жив и до него дошли. Проба смотрит
# на то, **доехал ли запрос**, а не на код.

version: 1

sites:
  - id: cloudflare
    name: Cloudflare
    url: https://cp.cloudflare.com/generate_204
    group: base
    note: "не ответил — интернета нет вовсе либо режут на выходе"

  - id: gstatic
    name: Google (204)
    url: https://connectivitycheck.gstatic.com/generate_204
    group: base
    note: "тем же адресом проверяет связь сам Android"

  - id: github
    name: GitHub
    url: https://github.com
    group: base
    note: "без него не работают наборы правил и обновление ядра"

  - id: yandex
    name: Яндекс
    url: https://ya.ru
    group: base
    note: "российский эталон: если не он один, дело не в блокировках"

  - id: youtube
    name: YouTube
    url: https://www.youtube.com/generate_204
    group: cdn
    note: "отвечает почти всегда, а вот скорость до него режут"

  - id: googlevideo
    name: YouTube CDN
    url: https://redirector.googlevideo.com/generate_204
    group: cdn
    note: "сюда идёт само видео — именно эту сеть и душат"

  - id: discord
    name: Discord
    url: https://discord.com/api/v9/gateway
    group: blocked
    note: "заблокирован в России; открывается только через VPN"

  - id: instagram
    name: Instagram
    url: https://www.instagram.com/favicon.ico
    group: blocked
    note: "заблокирован в России"

  - id: rutracker
    name: RuTracker
    url: https://rutracker.org/forum/index.php
    group: blocked
    note: "закрыт по решению суда; на нём же видно подмену DNS"

  - id: telegram
    name: Telegram (API)
    url: https://core.telegram.org
    group: blocked
    note: "ограничивается неравномерно, у разных провайдеров по-разному"
